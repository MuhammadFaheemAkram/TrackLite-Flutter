name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test & check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs exactly the Flutter version pinned in .fvmrc (3.47.6).
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3

      # One `pub get` at the root resolves the SDK and the sample together.
      - name: Install packages
        run: flutter pub get

      # Generated files are committed; fail if they are stale, or if a new
      # one was never committed (git diff alone can't see untracked files).
      # `--workspace` builds both packages' generated code in one run.
      - name: Generated code is up to date
        run: |
          dart run build_runner build --workspace
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      # One analysis of the whole workspace. The SDK's boundary is an
      # analyzer error too (implementation_imports).
      - name: Analyze
        run: flutter analyze

      # Each package's tests, from its own folder, so each must pass alone.
      - name: Test the SDK
        working-directory: packages/tracklite
        run: flutter test

      - name: Test the sample app
        working-directory: sample_app
        run: flutter test

      # What pub.dev would check before publishing: the pubspec, the
      # README, CHANGELOG and LICENSE, the files that would ship. A warning
      # fails the step too (exit code 65). Nothing is published.
      - name: Package is publishable
        working-directory: packages/tracklite
        run: flutter pub publish --dry-run
