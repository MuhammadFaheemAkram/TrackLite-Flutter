name: tracklite_sample
description: "The TrackLite sample app: the SDK integrated, with a debug dashboard."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# A member of the workspace: it resolves with the SDK next to it.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.2
  injectable: ^3.0.0
  intl: ^0.20.3
  material_ui: ^1.9.0
  # The SDK, from its folder: what a host would get from pub.dev or git.
  tracklite:
    path: ../packages/tracklite

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: 4.0.1
  go_router_builder: ^4.5.3
  injectable_generator: ^3.1.3
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
